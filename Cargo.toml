[workspace]
resolver = "2"
members = ["crates/scratchpad-core", "crates/scratchpad-web", "crates/scratchpad"]

[workspace.package]
# Unused: builds take their version from the git tag (crates/version.rs, scripts/version.sh).
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["ScaleXY"]
repository = "https://github.com/scalexy/scratchpad"
rust-version = "1.90"

[workspace.dependencies]
scratchpad-core = { path = "crates/scratchpad-core" }
scratchpad-web = { path = "crates/scratchpad-web" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"

# Key derivation for the credential vault is unbearably slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

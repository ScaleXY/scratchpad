# Builds, tests, signs and packages Scratchpad for every supported platform, then publishes a
# GitHub release, a multi-arch container image and (optionally) Microsoft Store and Mac App
# Store uploads.
#
# Trigger: push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N` for a prerelease) whose version matches
# Cargo.toml. scripts/release.sh prepares that commit and tag; see docs/releasing.md.
# Manual runs (workflow_dispatch) build everything and upload workflow artifacts only.
#
# Secrets (all optional; artifacts are unsigned without them):
#   macOS:   MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
#            or Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#            AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE
#   Linux:   GPG_PRIVATE_KEY, GPG_PASSPHRASE
#   Microsoft Store (environment "microsoft-store"): PARTNER_CENTER_TENANT_ID,
#            PARTNER_CENTER_SELLER_ID, PARTNER_CENTER_CLIENT_ID, PARTNER_CENTER_CLIENT_SECRET
#   Mac App Store: MAS_CERTIFICATES, MAS_CERTIFICATES_PASSWORD, MAS_PROVISIONING_PROFILE;
#            environment "mac-app-store": APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#            APP_STORE_CONNECT_KEY
# Variables: MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME, MSIX_DISPLAY_NAME,
#            MS_STORE_PRODUCT_ID (enables Store submissions), MS_STORE_AUTO_COMMIT ("true" to
#            submit for certification instead of leaving a draft). See docs/windows-store.md.
#            MAS_UPLOAD ("true" uploads to App Store Connect), MAS_APP_IDENTITY,
#            MAS_INSTALLER_IDENTITY. See docs/mac-app-store.md.
# Every artifact gets a Sigstore build-provenance attestation (no secrets needed).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
              exit 1
            fi
            publish=true
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease, publish: $publish)" >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes
        run: |
          if ! scripts/release-notes.sh "${{ steps.meta.outputs.version }}" > release-notes.md; then
            if [ "${{ steps.meta.outputs.publish }}" = true ]; then
              echo "::error::CHANGELOG.md has no section for ${{ steps.meta.outputs.version }}"
              exit 1
            fi
            echo "Development build" > release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-2022,     target: x86_64-pc-windows-msvc }
          - { name: windows-x86,   os: windows-2022,     target: i686-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm,   target: aarch64-pc-windows-msvc }
          - { name: macos-x64,     os: macos-15,         target: x86_64-apple-darwin }
          - { name: macos-arm64,   os: macos-15,         target: aarch64-apple-darwin }
          - { name: linux-x64,     os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-x86,     os: ubuntu-22.04,     target: i686-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install 32-bit toolchain (Linux x86)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Ensure clang is available (ring needs it on Windows arm64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) { choco install llvm -y --no-progress }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p scratchpad

      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }} --workspace

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: scripts/smoke-test.sh target/${{ matrix.target }}/release/scratchpad

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-test.ps1 -Binary target/${{ matrix.target }}/release/scratchpad.exe

      - name: Package & sign (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package-macos.sh ${{ matrix.target }} dist

      - name: Install Azure Trusted Signing client (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.86 -OutputDirectory "$env:RUNNER_TEMP\tsc"
          $arch = if ("${{ matrix.target }}" -like "aarch64*") { "arm64" } elseif ("${{ matrix.target }}" -like "i686*") { "x86" } else { "x64" }
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\tsc" -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match "\\$arch\\" } | Select-Object -First 1
          "AZURE_SIGNING_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package & sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          scripts/package-windows.ps1 -Target ${{ matrix.target }} -OutDir dist

      - name: Package & sign (Linux)
        if: runner.os == 'Linux'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          scripts/package-linux.sh ${{ matrix.target }} dist
          if [ "${{ matrix.target }}" = "i686-unknown-linux-gnu" ]; then
            dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
          else
            sudo apt-get install -y ./dist/*.deb
            scratchpad --version
            systemctl cat scratchpad.service
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scratchpad-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  msix:
    name: Microsoft Store package (MSIX)
    needs: [prepare, build]
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scratchpad-windows-*
          path: windows
          merge-multiple: true
      - name: Package and bundle
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $targets = @{ x64 = "x86_64-pc-windows-msvc"; x86 = "i686-pc-windows-msvc"; arm64 = "aarch64-pc-windows-msvc" }
          foreach ($arch in $targets.Keys) {
            # Reuse the (signed) scratchpad.exe from each architecture's release zip.
            $out = "target\$($targets[$arch])\release"
            Expand-Archive "windows\scratchpad-$version-windows-$arch.zip" -DestinationPath $out -Force
            scripts/package-msix.ps1 -Target $targets[$arch] -OutDir dist-store
          }
          scripts/package-msix.ps1 -Bundle -OutDir dist-store
          Get-ChildItem dist-store
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-store/*
      # Store-only: the Store signs the package. Not attached to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msstore-package
          path: |
            dist-store/*.msixbundle
            dist-store/*.msixupload
          if-no-files-found: error

  mac-app-store:
    name: Mac App Store package
    needs: [prepare, build]
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scratchpad-macos-*
          path: macos
          merge-multiple: true
      - name: Package and sign
        env:
          MAS_CERTIFICATES: ${{ secrets.MAS_CERTIFICATES }}
          MAS_CERTIFICATES_PASSWORD: ${{ secrets.MAS_CERTIFICATES_PASSWORD }}
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          MAS_APP_IDENTITY: ${{ vars.MAS_APP_IDENTITY }}
          MAS_INSTALLER_IDENTITY: ${{ vars.MAS_INSTALLER_IDENTITY }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          # Reuse the tested binaries from each architecture's CLI archive.
          for pair in arm64:aarch64-apple-darwin x64:x86_64-apple-darwin; do
            mkdir -p "target/${pair#*:}/release"
            tar -xzf "macos/scratchpad-$version-macos-${pair%%:*}-cli.tar.gz" -C "target/${pair#*:}/release"
          done
          if [ -n "$MAS_PROFILE_BASE64" ]; then
            echo "$MAS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/scratchpad.provisionprofile"
            export MAS_PROVISIONING_PROFILE="$RUNNER_TEMP/scratchpad.provisionprofile"
          fi
          scripts/package-macos-appstore.sh dist-mas
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-mas/*.pkg
      # Store-only: Apple re-signs the app. Not attached to the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-store-package
          path: dist-mas/*.pkg
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scratchpad-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd dist
          sha256sum $(ls | grep -v '\.asc$') > SHA256SUMS
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign SHA256SUMS
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Scratchpad ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}

  store:
    name: Microsoft Store submission
    needs: [prepare, msix, release]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false' && vars.MS_STORE_PRODUCT_ID != ''
    runs-on: windows-2022
    # Add required reviewers to this environment to approve each submission.
    environment: microsoft-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msstore-package
          path: store
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Configure Partner Center credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
      - name: Upload to Partner Center
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
          AUTO_COMMIT: ${{ vars.MS_STORE_AUTO_COMMIT }}
        run: |
          $upload = (Get-ChildItem store -Filter *.msixupload | Select-Object -First 1).FullName
          $command = @("publish", (Resolve-Path store).Path, "--inputFile", $upload, "--appId", $env:PRODUCT_ID)
          # By default the submission stays a draft: review the listing and commit it in Partner Center.
          if ($env:AUTO_COMMIT -ne "true") { $command += "--noCommit" }
          msstore @command
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }
          msstore submission status $env:PRODUCT_ID

  mac-app-store-upload:
    name: Mac App Store upload (TestFlight)
    needs: [prepare, mac-app-store, release]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false' && vars.MAS_UPLOAD == 'true'
    runs-on: macos-15
    # Add required reviewers to this environment to approve each upload.
    environment: mac-app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-store-package
          path: mas
      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: scripts/package-macos-appstore.sh --upload mas/scratchpad-${{ needs.prepare.outputs.version }}-macos-appstore.pkg

  container:
    name: Container image (headless)
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=${{ needs.prepare.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

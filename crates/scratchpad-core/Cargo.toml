[package]
name = "scratchpad-core"
description = "Core of Scratchpad: SMTP capture server, storage, analysis, forwarding, sharing and remote mailboxes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
futures.workspace = true
uuid.workspace = true
base64.workspace = true
mail-parser = { version = "0.11", features = ["full_encoding"] }
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
html2text = "0.15"
rand = "0.9"
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1"
url = "2"
